<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color-scheme: dark;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <script type="text/javascript">
    (function () {
      // Use the currently responding Adsterra delivery host. The previous
      // primary host returned HTTP 403 for every configured zone.
      var host = 'https://alwingulla.com';
      var fallbackHost = 'https://nobleduringsurveillance.com';
      var zones = {
        bannerDesktop: { key: '23a798c8294b23d3b5f73561f68cc621', width: 728, height: 90 },
        bannerTablet:  { key: '8658915090686e956a2289c72ba73b71', width: 468, height: 60 },
        bannerMobile:  { key: 'cee89ddb1e1c5bd615b6d0a22ba3d9e8', width: 320, height: 50 },
        square:        { key: '586e1584081dab0775623a2b61895f68', width: 300, height: 250 },
        sidebar:       { key: 'c13f5f2182fb9c307a05678f246a92d3', width: 160, height: 600 },
        banner160x300: { key: '1a081bf3ee58c48ede1caf299a4f2e36', width: 160, height: 300 },
        native:        { key: '90963118e211fbe13565d79b0d81a39d', native: true }
      };

      var params = new URLSearchParams(location.search);
      var zoneName = params.get('zone');
      var zone = zones[zoneName];
      if (!zone) return;

      // Set dimension hints
      if (zone.width && zone.height) {
        document.documentElement.style.width  = zone.width  + 'px';
        document.documentElement.style.height = zone.height + 'px';
        document.body.style.width  = zone.width  + 'px';
        document.body.style.height = zone.height + 'px';
      }

      var loadedNotified = false;
      function isVisible(el) {
        if (!el) return false;
        var style = window.getComputedStyle(el);
        if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') return false;
        var rect = el.getBoundingClientRect();
        return rect.left >= -50 && rect.top >= -50 && rect.width >= 10 && rect.height >= 10;
      }

      function notifyLoaded() {
        if (loadedNotified) return;
        loadedNotified = true;
        try {
          window.parent.postMessage({ type: 'AD_LOADED', zone: zoneName }, '*');
        } catch (e) {}
      }

      function checkAndNotify() {
        var elements = document.querySelectorAll('iframe, img[src]:not([src=""]), video, object, embed, ins, [data-creative], a[href] img');
        for (var i = 0; i < elements.length; i += 1) {
          if (isVisible(elements[i])) {
            notifyLoaded();
            return true;
          }
        }
        var containers = document.querySelectorAll('div[id^="container-"]');
        for (var j = 0; j < containers.length; j += 1) {
          if (containers[j].children.length > 0 && isVisible(containers[j])) {
            notifyLoaded();
            return true;
          }
        }
        return false;
      }

      // Notify parent window when ad is rendered and visible on screen
      try {
        var obs = new MutationObserver(function () {
          checkAndNotify();
        });
        obs.observe(document.body, { childList: true, subtree: true });
      } catch (e) {}

      var pollTimer = setInterval(function () {
        if (checkAndNotify()) {
          clearInterval(pollTimer);
        }
      }, 500);
      setTimeout(function () { clearInterval(pollTimer); }, 20000);

      if (zone.native) {
        // Adsterra's native tag must be parser-inserted so its invoke script
        // can discover the container while the document is being written.
        document.write(
          '<div id="container-' + zone.key + '" style="width:100%;min-height:280px"></div>' +
          '<script async="async" data-cfasync="false" src="' + host + '/' + zone.key + '/invoke.js" ' +
            'onerror="this.onerror=null;this.src=\'' + fallbackHost + '/' + zone.key + '/invoke.js\';"><\/script>'
        );
        return;
      }

      // Keep the official banner format parser-inserted as well. Dynamic
      // script insertion leaves the publisher iframe empty on some browsers.
      document.write(
        '<script type="text/javascript">' +
          'window.atOptions={' +
            'key:"' + zone.key + '",' +
            'format:"iframe",' +
            'height:' + zone.height + ',' +
            'width:' + zone.width + ',' +
            'params:{}' +
          '};atOptions=window.atOptions;' +
        '<\/script>' +
        '<script type="text/javascript" data-cfasync="false" src="' + host + '/' + zone.key + '/invoke.js" ' +
          'onerror="this.onerror=null;this.src=\'' + fallbackHost + '/' + zone.key + '/invoke.js\';"><\/script>'
      );
    }());
  </script>
</body>
</html>
